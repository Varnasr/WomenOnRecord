name: checks
on:
  push:
    branches: [main]
  pull_request:

# A newer commit on a pull request cancels the run still going for the older one.
# Runs on the default branch are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only: this workflow checks the repository and writes nothing back to it.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 scripts/build_data.py --check
      - run: python3 scripts/build_site_data.py --check
      - run: python3 scripts/build_context.py --check
      - run: python3 scripts/build_explore.py --check
      - run: python3 scripts/build_pages.py --check
      - run: python3 scripts/build_i18n.py --check
      - run: python3 scripts/check.py
  browser:
    # Separate from the static checks, so a contributor waiting on those does not
    # wait on a browser download. The site loads nothing from another origin, so
    # a failed request here is a fault in the site.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: node scripts/audit.mjs
