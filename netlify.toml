[build]
  publish = "."

# The site's first address. Every page on it moves to the same page here.
[[redirects]]
  from = "https://shecounts.netlify.app/*"
  to = "https://www.womenonrecord.net/:splat"
  status = 301
  force = true

# The data files carried the site's first name, She Counts, until October 2026.
[[redirects]]
  from = "/data/shecounts.csv"
  to = "/data/womenonrecord.csv"
  status = 301
[[redirects]]
  from = "/downloads/shecounts.xlsx"
  to = "/downloads/womenonrecord.xlsx"
  status = 301

# Repository files that are not part of the site.
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/i18n/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/site/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
# Pages keep Netlify's default, public, max-age=0, must-revalidate, so a
# reader never sees an old page. Everything a page loads carries ?v=<hash of
# its contents> (scripts/build_pages.py), so CSS and JS are kept for a year:
# a changed file has a new address.
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
